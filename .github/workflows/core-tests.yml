name: Core tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install tested packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest \
            -e ./src/osh_coverage_core \
            -e ./src/osh_coverage_ros \
            -e ./tools/sphere_target_registration
      - name: Test coverage core
        run: python -m unittest discover -s src/osh_coverage_core/test -v
      - name: Test sphere-target registration
        run: python -m unittest discover -s tools/sphere_target_registration/tests -v
      - name: Test Woosh protocol safety helpers
        run: python -m pytest -q src/osh_coverage_ros/test
      - name: Check Python syntax
        run: python -m compileall -q src scripts tools/sphere_target_registration/src
