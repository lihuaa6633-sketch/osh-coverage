common:
  msg_source: 1
  send_packet_ros: false
  send_point_cloud_ros: true

lidar:
  - driver:
      lidar_type: RSAIRY
      msop_port: 6699
      difop_port: 7788
      imu_port: 6688
      min_distance: 0.10
      max_distance: 60.0
      use_lidar_clock: true
      dense_points: false
      ts_first_point: true
      start_angle: 0
      end_angle: 360
    ros:
      ros_frame_id: airy_link
      ros_send_point_cloud_topic: /rslidar_points
      ros_send_imu_data_topic: /rslidar_imu_data
      ros_queue_length: 100

