[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sphere-target-registration"
version = "0.1.0"
description = "Robust sphere-target fitting and rigid point-cloud georeferencing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[project.scripts]
sphere-target-register = "sphere_target_registration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
